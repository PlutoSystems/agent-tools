[project]
name = "agent-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=17.0.1",
    "azure-identity>=1.25.1",
    "dotenv>=0.9.9",
    "extract-msg>=0.55.0",
    "google-genai>=2.6.0",
    "hatchling>=1.27.0",
    "markitdown[docx,pdf]>=0.1.5",
    "mcp>=1.25.0",
    "msal>=1.34.0",
    "msal-extensions>=1.3.1",
    "opencv-python-headless>=4.13.0.92",
    "requests>=2.32.5",
    "tzdata>=2025.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lib", "src/tools"]
